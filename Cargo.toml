[package]
name = "drift-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Tenant-scoped administration and recovery CLI for Drift"
repository = "https://github.com/cuzz22000/drift-cli"
license = "Apache-2.0"

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
predicates = "3.1.4"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = "symbols"
